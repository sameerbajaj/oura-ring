[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "oura-ring"
version = "1.0.0"
description = "Oura Ring V2 API integration and tactical morning coach"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [
    {name = "Sameer Bajaj", email = "sameer@sameerbajaj.com"}
]
keywords = ["oura", "health", "sleep", "hrv", "api"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
]
dependencies = [
    "requests>=2.31.0",
    "python-dotenv>=1.0.0",
]

[project.urls]
Homepage = "https://sameerbajaj.com/tools/clawdbot-skills/"
Repository = "https://github.com/sameerbajaj/oura-ring"
