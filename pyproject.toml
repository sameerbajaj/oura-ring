[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "sameer-oura-ring"
version = "1.0.0"
description = "Oura Ring V2 API integration and tactical morning coach"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
authors = [
    {name = "Sameer Bajaj", email = "sameer@sameerbajaj.com"}
]
keywords = ["oura", "health", "sleep", "hrv", "api"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: End Users/Desktop",
    "Programming Language :: Python :: 3",
]
dependencies = [
    "requests>=2.31.0",
    "python-dotenv>=1.0.0",
]

[project.scripts]
oura-ring = "cli:main"

[tool.setuptools]
py-modules = ["cli", "oura_ring", "probe_v2", "probe_v2_sessions"]

[project.urls]
Homepage = "https://sameerbajaj.com/tools/"
Website = "https://sameerbajaj.com"
Repository = "https://github.com/sameerbajaj/oura-ring"
